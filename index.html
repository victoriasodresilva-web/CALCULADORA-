<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora simples</title>
  <link rel="stylesheet" href="estilo.css">
</head>


<body>
  <main>
    <h1>Calculadora simples</h1>


    <label for="numero1">Primeiro número:</label>
    <input type="number" id="numero1" step="any"
           placeholder="Digite um número">


    <label for="numero2">Segundo número:</label>
    <input type="number" id="numero2" step="any"
           placeholder="Digite outro número">


    <div class="operacoes">
      <!-- Cada botão informa qual operação será realizada. -->
      <button type="button" onclick="calcular('somar')">Somar (+)</button>
      <button type="button" onclick="calcular('subtrair')">Subtrair (−)</button>
      <button type="button" onclick="calcular('multiplicar')">Multiplicar (×)</button>
      <button type="button" onclick="calcular('dividir')">Dividir (÷)</button>
    </div>


    <!-- O JavaScript atualiza o texto deste parágrafo. -->
    <p id="resultado" aria-live="polite">
      O resultado aparecerá aqui.
    </p>
  </main>
<script src="script.js">


</script>
  </body>
</html>
